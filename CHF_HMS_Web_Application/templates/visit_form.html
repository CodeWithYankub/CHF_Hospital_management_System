{% extends 'base.html' %}{% block title %}New Visit{% endblock %}{% block content %}<h1>New Visit — {{ patient.full_name }}</h1><form method="post"><div class="card"><h2>Visit Information</h2><div class="row"><div class="field"><label>Department</label><select name="department"><option>Outpatient</option><option>Emergency</option><option>Maternity</option><option>Pediatrics</option><option>Inpatient</option><option>Surgery</option></select></div><div class="field"><label>Clinician</label><input name="clinician" value="{{ current_user.full_name }}"></div></div><div class="field"><label>Presenting complaint</label><textarea name="complaint"></textarea></div><div class="field"><label>Diagnosis</label><textarea name="diagnosis"></textarea></div><div class="field"><label>Treatment plan</label><textarea name="treatment_plan"></textarea></div><div class="field"><label>Status</label><select name="status"><option>Open</option><option>Completed</option><option>Admitted</option><option>Referred</option></select></div></div><div class="card"><h2>Vital Signs</h2><div class="row"><div class="field"><label>Temperature °C</label><input type="number" step="0.1" name="temperature"></div><div class="field"><label>Blood pressure — systolic</label><input type="number" name="systolic"></div><div class="field"><label>Blood pressure — diastolic</label><input type="number" name="diastolic"></div><div class="field"><label>Pulse / minute</label><input type="number" name="pulse"></div><div class="field"><label>Respiratory rate</label><input type="number" name="respiratory_rate"></div><div class="field"><label>Oxygen saturation %</label><input type="number" name="oxygen_saturation"></div><div class="field"><label>Weight kg</label><input type="number" step="0.1" name="weight_kg"></div><div class="field"><label>Height cm</label><input type="number" step="0.1" name="height_cm"></div></div></div><button class="btn" type="submit">Save Visit</button></form>{% endblock %}
