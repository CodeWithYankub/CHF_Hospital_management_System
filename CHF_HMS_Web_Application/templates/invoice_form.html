{% extends 'base.html' %}{% block title %}New Invoice{% endblock %}{% block content %}<h1>Create Invoice</h1><form method="post" class="card"><div class="field"><label>Patient *</label><select name="patient_id" required><option value="">Select patient</option>{% for p in patients %}<option value="{{ p.id }}">{{ p.patient_no }} — {{ p.full_name }}</option>{% endfor %}</select></div><div class="field"><label>Service or item description *</label><input name="description" required placeholder="Consultation, laboratory, medication, admission"></div><div class="row"><div class="field"><label>Total amount (SLE) *</label><input type="number" step="0.01" min="0" name="amount" required></div><div class="field"><label>Amount paid now</label><input type="number" step="0.01" min="0" name="amount_paid" value="0"></div><div class="field"><label>Payment method</label><select name="payment_method"><option>Cash</option><option>Mobile money</option><option>Bank</option><option>Card</option><option>Waived</option></select></div><div class="field"><label>Free-care / waiver reason</label><input name="waived_reason"></div></div><button class="btn">Create Invoice</button></form>{% endblock %}
