{% extends 'base.html' %}{% block title %}Register Patient{% endblock %}{% block content %}<h1>Register New Patient</h1><form method="post" class="card"><div class="row"><div class="field"><label>First name *</label><input name="first_name" required></div><div class="field"><label>Last name *</label><input name="last_name" required></div><div class="field"><label>Sex *</label><select name="sex" required><option value="">Select</option><option>Female</option><option>Male</option><option>Other</option></select></div><div class="field"><label>Date of birth</label><input type="date" name="date_of_birth"></div><div class="field"><label>Telephone</label><input name="phone"></div><div class="field"><label>District</label><input name="district" value="Tonkolili"></div><div class="field"><label>Blood group</label><select name="blood_group"><option value="">Unknown</option>{% for x in ['A+','A-','B+','B-','AB+','AB-','O+','O-'] %}<option>{{ x }}</option>{% endfor %}</select></div><div class="field"><label>Sickle-cell status</label><select name="sickle_cell_status"><option>Unknown</option><option>Negative</option><option>Trait</option><option>Disease</option></select></div><div class="field"><label>Next of kin</label><input name="next_of_kin"></div><div class="field"><label>Next-of-kin telephone</label><input name="next_of_kin_phone"></div><div class="field"><label>Care category</label><select name="free_care_category"><option>Paying</option><option>Pregnant woman — Free care</option><option>Lactating mother — Free care</option><option>Under-five child — Free care</option><option>Charity</option><option>Donor-sponsored</option><option>Staff</option></select></div></div><div class="field"><label>Address / village</label><textarea name="address"></textarea></div><div class="field"><label>Known allergies</label><textarea name="allergies"></textarea></div><button class="btn" type="submit">Register Patient</button></form>{% endblock %}
