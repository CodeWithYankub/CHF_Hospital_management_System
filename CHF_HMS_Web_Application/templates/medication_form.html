{% extends 'base.html' %}{% block title %}Add Medication{% endblock %}{% block content %}<h1>Add Medication</h1><form method="post" class="card"><div class="row"><div class="field"><label>Name *</label><input name="name" required></div><div class="field"><label>Strength</label><input name="strength" placeholder="500 mg"></div><div class="field"><label>Dosage form</label><input name="dosage_form" placeholder="Tablet, syrup, injection"></div><div class="field"><label>Batch number</label><input name="batch_no"></div><div class="field"><label>Expiry date</label><input type="date" name="expiry_date"></div><div class="field"><label>Opening quantity</label><input type="number" name="quantity" value="0" min="0"></div><div class="field"><label>Reorder level</label><input type="number" name="reorder_level" value="10" min="0"></div><div class="field"><label>Unit cost</label><input type="number" step="0.01" name="unit_cost" value="0"></div><div class="field"><label>Selling price</label><input type="number" step="0.01" name="selling_price" value="0"></div><div class="field"><label>Source</label><select name="source"><option>Purchased</option><option>Donated</option><option>Government supply</option><option>Medical mission</option></select></div></div><button class="btn">Save Medication</button></form>{% endblock %}
